# AIIA + feeder section templates (sprints/SPRINT_AIIA.md WI-2).
#
# AIIA rows are seeded for the three tiers that ever reach AIIA creation
# (high_risk, limited_risk, minimal_risk) — prohibited and requires_context
# are blocked at the classification gate before an AIIA can exist.
# risk_identification is required at every tier: it's the section
# AI_SUGGESTED proposed-risk items attach to.
#
# Feeder rows (fria/dpia/model_risk) are seeded now even though feeder
# creation is Phase B (docs/AIIA_DESIGN.md §10) — cheap to seed ahead.
# aiia_target_section_key maps a feeder section into the AIIA section it
# surfaces under; omitted/null means feeder-private (surfaces in no AIIA
# section by design — the future export pack carries it instead).

# ---------------------------------------------------------------- aiia / high_risk
- type: aiia
  tier: high_risk
  section_key: system_overview
  title: "System & Use Case Overview"
  applicability: required
  prompt: "Describe the AI system, its intended purpose, and the deployment context for this use case."
  iso_42005_clause: "5.2"
  sort_order: 10
- type: aiia
  tier: high_risk
  section_key: stakeholders_affected_parties
  title: "Affected Parties & Rights Impact"
  applicability: required
  prompt: "Identify who is affected by this system (incl. vulnerable groups) and the fundamental-rights impact on each."
  iso_42005_clause: "5.4"
  sort_order: 20
- type: aiia
  tier: high_risk
  section_key: data_governance
  title: "Data Sources, Categories & Quality"
  applicability: required
  prompt: "Describe the data processed, its categories (incl. special-category data), provenance, and quality/bias controls."
  iso_42005_clause: "5.5"
  sort_order: 30
- type: aiia
  tier: high_risk
  section_key: technical_robustness
  title: "Technical Robustness, Accuracy & Cybersecurity"
  applicability: required
  prompt: "Assess the system's accuracy, robustness to adversarial input, and cybersecurity posture."
  iso_42005_clause: "5.6"
  sort_order: 40
- type: aiia
  tier: high_risk
  section_key: human_oversight
  title: "Human Oversight Measures"
  applicability: required
  prompt: "Describe the human oversight measures in place (EU AI Act Art. 14) and their adequacy for this use case."
  iso_42005_clause: "5.7"
  sort_order: 50
- type: aiia
  tier: high_risk
  section_key: transparency_disclosure
  title: "Transparency & User Disclosure"
  applicability: required
  prompt: "Describe what is disclosed to affected individuals about this system's use, scope, and limitations (EU AI Act Art. 50)."
  iso_42005_clause: "5.8"
  sort_order: 60
- type: aiia
  tier: high_risk
  section_key: risk_identification
  title: "Identified Risks & Mitigations"
  applicability: required
  prompt: "The risks identified for this use case, their treatment, and residual exposure."
  iso_42005_clause: "5.9"
  sort_order: 70
- type: aiia
  tier: high_risk
  section_key: residual_risk_monitoring
  title: "Residual Risk & Post-Market Monitoring"
  applicability: required
  prompt: "Summarise residual risk after mitigation and the post-deployment monitoring plan."
  iso_42005_clause: "5.10"
  sort_order: 80
- type: aiia
  tier: high_risk
  section_key: conformity_legal_basis
  title: "Conformity & Legal Basis"
  applicability: required
  prompt: "Record the classification basis and the legal references that govern this use case."
  iso_42005_clause: "5.3"
  sort_order: 90

