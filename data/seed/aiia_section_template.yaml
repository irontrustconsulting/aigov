  sort_order: 10
- type: dpia
  tier: high_risk
  section_key: dpia_necessity_proportionality
  title: "Necessity & Proportionality"
  applicability: required
  prompt: "Assess whether the processing is necessary and proportionate to the stated purpose."
  iso_42005_clause: "5.5"
  sort_order: 20
- type: dpia
  tier: limited_risk
  section_key: dpia_data_categories
  title: "Personal Data Categories Processed"
  applicability: recommended
  prompt: "Describe the personal data categories processed."
  iso_42005_clause: "5.5"
  aiia_target_section_key: data_governance
  sort_order: 10
- type: dpia
  tier: limited_risk
  section_key: dpia_necessity_proportionality
  title: "Necessity & Proportionality"
  applicability: recommended
  prompt: "Assess whether the processing is necessary and proportionate."
  iso_42005_clause: "5.5"
  sort_order: 20
- type: dpia
  tier: minimal_risk
  section_key: dpia_data_categories
  title: "Personal Data Categories Processed"
  applicability: recommended
  prompt: "Describe the personal data categories processed, if any."
  iso_42005_clause: "5.5"
  aiia_target_section_key: data_governance
  sort_order: 10
- type: dpia
  tier: minimal_risk
  section_key: dpia_necessity_proportionality
  title: "Necessity & Proportionality"
  applicability: recommended
  prompt: "Assess whether the processing is necessary and proportionate, if relevant."
  iso_42005_clause: "5.5"
  sort_order: 20

# ------------------------------- model_risk feeder / high_risk + limited_risk + minimal_risk
# MODEL_RISK is "always recommended" regardless of tier (§5.3), so it is
# seeded at every tier; model_risk_model_description (the §5.4 pre-fill
# target) is required at every tier — every model feeder needs to say what
# the model is, even when the deeper analysis sections are only recommended.
- type: model_risk
  tier: high_risk
  section_key: model_risk_model_description
  title: "Model Description"
  applicability: required
  prompt: "Describe the model: product, modality, and hosting (pre-filled from the system's registered facts)."
  iso_42005_clause: "5.6"
  aiia_target_section_key: technical_robustness
  sort_order: 5
- type: model_risk
  tier: high_risk
  section_key: model_risk_validation
  title: "Model Validation"
  applicability: required
  prompt: "Describe the model's validation process and observed accuracy/robustness."
  iso_42005_clause: "5.6"
  aiia_target_section_key: technical_robustness
  sort_order: 10
- type: model_risk
  tier: high_risk
  section_key: model_risk_identified_risks
  title: "Identified Technical Risks"
  applicability: required
  prompt: "Technical risks identified for this model (OWASP LLM Top 10) — populated from proposed risks."
  iso_42005_clause: "5.9"
  aiia_target_section_key: risk_identification
  sort_order: 15
- type: model_risk
  tier: high_risk
  section_key: model_risk_drift_monitoring
