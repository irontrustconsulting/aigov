# ------------------------------------------------------- fria feeder / high_risk
# (Phase B consumes these — see sprints/SPRINT_AIIA_FEEDERS.md §5.1/§5.4.
# FRIA's required/recommended trigger is tier-driven (HIGH only, §5.3), so
# it is seeded at high_risk only.)
- type: fria
  tier: high_risk
  section_key: fria_affected_persons
  title: "Affected Persons & Groups"
  applicability: required
  prompt: "List the persons/groups affected by this system (pre-filled from the system's registered affected parties)."
  iso_42005_clause: "5.4"
  aiia_target_section_key: stakeholders_affected_parties
  sort_order: 5
- type: fria
  tier: high_risk
  section_key: fria_rights_impact
  title: "Fundamental Rights Impact"
  applicability: required
  prompt: "Assess the impact on fundamental rights for affected individuals."
  iso_42005_clause: "5.4"
  aiia_target_section_key: stakeholders_affected_parties
  sort_order: 10
- type: fria
  tier: high_risk
  section_key: fria_vulnerable_groups
  title: "Vulnerable Group Considerations"
  applicability: required
  prompt: "Assess specific risk to vulnerable groups (EU AI Act Art. 27)."
  iso_42005_clause: "5.4"
  aiia_target_section_key: stakeholders_affected_parties
  sort_order: 20
- type: fria
  tier: high_risk
  section_key: fria_internal_complaint_process
  title: "Internal Complaint & Redress Process"
  applicability: recommended
  prompt: "Describe the internal process for individuals to raise concerns or seek redress."
  iso_42005_clause: "5.4"
  # No aiia_target_section_key — feeder-private (design doc §9.2).
  sort_order: 30

# ------------------------------------- dpia feeder / high_risk + limited_risk + minimal_risk
# DPIA's trigger is data-driven, not tier-driven (§5.3), so it is seeded at
# every tier; applicability still scales down by tier.
- type: dpia
  tier: high_risk
  section_key: dpia_data_categories
  title: "Personal Data Categories Processed"
  applicability: required
  prompt: "Describe the personal data categories processed, incl. special-category data."
  iso_42005_clause: "5.5"
