# Seed data: Risk <-> Control cross-map — full coverage.
#
# Every risk in risks.yaml is mapped to the controls in controls.yaml that
# mitigate it. One risk can map to multiple controls; one control can mitigate
# multiple risks — this is the cross-walk that propagates evidence across
# frameworks (ISO 42001, EU AI Act, NIST AI RMF) simultaneously.
#
# strength values:
#   full    — the control directly and substantially addresses the risk
#   partial — the control contributes to mitigation but does not fully cover it
#
# References both sides by their human-readable codes; the loader resolves
# to ids. Both the risk and the control must be seeded before this map runs.

# ===========================================================================
# OWASP LLM RISKS
# ===========================================================================

