# ─────────────────────────────────────────────────────────────────────────
- risk_code: LLM01
  control_code: HO-01        # Human oversight can detect/correct injected behaviour
  strength: partial

- risk_code: LLM01
  control_code: AC-01        # Restrict who/what can supply inputs to the system
  strength: partial

- risk_code: LLM01
  control_code: OUT-01       # Validate outputs to limit damage from injected commands
  strength: partial

- risk_code: LLM01
  control_code: PE-01        # Purpose limitation constrains what actions the model can take
  strength: partial

- risk_code: LLM01
  control_code: MC-01        # Monitor for anomalous outputs indicative of injection
  strength: partial

