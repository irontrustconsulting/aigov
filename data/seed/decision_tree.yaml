# EU AI Act Classification Decision Tree — v1.0
#
# Version is the legal-review boundary: bump version for ANY content change.
# The seed loader refuses to mutate a frozen version (fail loud, require bump).
#
# Structure:
#   probes_rung: which tier rung this question probes (PROHIBITED|HIGH|LIMITED)
#                null = general-purpose discriminator
#   options[].asserts_rung: the rung asserted by a "yes" answer (null = no assertion)
#   options[].asserts_subcategory_code: specific EUAIActSubcategory code for
#              basis tracking; must match a code in eu_ai_act_subcategory table.
#
# Resolution: precedence ladder PROHIBITED > HIGH > LIMITED > MINIMAL.
# MINIMAL is the affirmative result when all questions are answered and
# no higher rung is asserted. Never a fallback for incomplete answers.

version: "1.0"
name: "EU AI Act Classification Tree v1.0"

