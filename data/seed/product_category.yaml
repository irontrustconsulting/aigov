# Seed data: user-facing product categories (familiar business vocabulary).
#
# These are the wizard's drill-down vocabulary — what a normal business user
# recognises, NOT compliance language. Hierarchical via `parent` (a parent
# code; null/absent = top-level). The bridge file maps these to EU AI Act
# subcategories for the governance translation.
#
# Keep this vocabulary user-friendly. The compliance mapping happens separately.

# ===========================================================================
# TOP-LEVEL GROUPS
# ===========================================================================

- code: HR_RECRUITMENT
  name: HR & Recruitment
  description: Tools used in hiring, people management and HR operations.

- code: PRODUCTIVITY
  name: Productivity & Content
  description: General assistants for writing, summarising and content creation.

- code: CUSTOMER_ENGAGEMENT
  name: Customer Engagement
  description: Chatbots and assistants that interact with customers or employees.

- code: DEVELOPER_TOOLS
  name: Developer & Engineering Tools
  description: AI tools that assist software development, code generation and testing.

- code: SALES_CRM
  name: Sales & CRM
  description: AI tools embedded in or augmenting sales, revenue and CRM workflows.

- code: MARKETING
  name: Marketing & Advertising
  description: AI tools for content creation, campaign management and personalisation.

- code: DATA_ANALYTICS
  name: Data & Analytics
  description: AI-powered analytics, business intelligence and data platform tools.

- code: SECURITY_OPS
  name: Security & Threat Detection
  description: AI tools for cybersecurity operations, threat detection and response.

- code: COMMUNICATIONS
  name: Communications & Meetings
  description: AI tools embedded in video conferencing, messaging and note-taking.

- code: DOCUMENT_PROCESSING
  name: Document Processing & Automation
  description: AI for extracting, classifying and processing unstructured documents.

- code: LEGAL_COMPLIANCE
  name: Legal & Compliance
  description: AI tools assisting legal research, contract review and regulatory compliance.

- code: MEDIA_GENERATION
  name: Media Generation
  description: AI tools for generating or editing images, video, audio and voice.

- code: SEARCH_KNOWLEDGE
  name: Search & Knowledge Management
  description: AI-powered enterprise search and knowledge-base tools.

- code: TRANSLATION_LANGUAGE
  name: Translation & Language
  description: AI translation, localisation and language processing tools.

