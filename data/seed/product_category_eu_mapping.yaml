# Seed data: the BRIDGE — product category -> EU AI Act subcategory.
#
# ⚠️  REGULATORY MAPPING — VERIFY AS THE DOMAIN EXPERT.
# Maps user-facing product categories to the governing EU AI Act subcategory.
#
# is_primary: true marks the proposed default. Per the single-governing-tier rule,
# the PRIMARY points at the HIGHEST-RISK applicable subcategory where applicable
# (propose the stricter classification; the user justifies down via override).
# A category may list non-primary alternatives (other plausible regulated uses).
#
# IMPORTANT DISCLAIMER ON MAPPING CONFIDENCE:
#   CONFIRMED (⬛): Mapping is well-grounded in the Act's text — the category
#     clearly falls within the cited Annex/Article.
#   PLAUSIBLE (◻): The Act is ambiguous or the category spans multiple risk levels
#     depending on deployment context. The classification engine must drive the
#     final determination; this is the default starting point only.
#   MINIMAL / UNCLASSIFIED: For categories with no specific EU AI Act trigger,
#     the classification wizard routes the user through context questions.
#     These categories carry no primary EU mapping; the wizard is the correct path.
#
# References both sides by code; loader resolves to ids.

# ===========================================================================
# ORIGINAL CATEGORIES (carried forward)
# ===========================================================================

# Hiring & screening -> EMP-RECRUIT (HIGH RISK, Annex III(4)(a)) ⬛
# Clear: AI that filters, analyses and evaluates candidates in employment.
- product_category_code: HR_HIRING
  eu_ai_act_subcategory_code: EMP-RECRUIT
  is_primary: true

# Performance & workforce mgmt -> EMP-MANAGE (HIGH RISK, Annex III(4)(b)) ⬛
# Clear: AI used for performance monitoring, task allocation and promotion/termination.
- product_category_code: HR_PERFORMANCE
  eu_ai_act_subcategory_code: EMP-MANAGE
  is_primary: true

# Writing assistants -> TRANS-SYNTHETIC-CONTENT (LIMITED, Art. 50(2)) ◻
# General drafting assistance may trigger synthetic content marking obligations.
# Many deployers will confirm minimal risk after reviewing context.
- product_category_code: PROD_WRITING
  eu_ai_act_subcategory_code: TRANS-SYNTHETIC-CONTENT
  is_primary: true

# Image generation -> TRANS-SYNTHETIC-CONTENT (LIMITED, Art. 50(2)) ⬛
# AI-generated images require machine-readable marking as AI-generated.
- product_category_code: PROD_IMAGE
  eu_ai_act_subcategory_code: TRANS-SYNTHETIC-CONTENT
  is_primary: true

# Image generation -> TRANS-DEEPFAKE (LIMITED, Art. 50(4)) ◻ (non-primary)
# Where generated images depict real people, deepfake disclosure may apply.
- product_category_code: PROD_IMAGE
  eu_ai_act_subcategory_code: TRANS-DEEPFAKE
  is_primary: false

# Customer chatbots -> TRANS-DIRECT-INTERACTION (LIMITED, Art. 50(1)) ⬛
# Systems interacting directly with people must disclose they are AI.
- product_category_code: CE_CHATBOT
  eu_ai_act_subcategory_code: TRANS-DIRECT-INTERACTION
  is_primary: true

# ===========================================================================
# NEW CATEGORIES
# ===========================================================================

# HR Talent Intelligence & Skills
# Depends heavily on deployment: if used to make or assist hiring/promotion
# decisions -> HIGH RISK (EMP-RECRUIT or EMP-MANAGE). If used for internal
# skills mapping / career development without employment decisions -> lower risk.
# Primary: EMP-RECRUIT as the conservative default. ◻
- product_category_code: HR_TALENT_INTEL
  eu_ai_act_subcategory_code: EMP-RECRUIT
  is_primary: true
- product_category_code: HR_TALENT_INTEL
  eu_ai_act_subcategory_code: EMP-MANAGE
  is_primary: false

