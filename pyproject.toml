[project]
name = "aigov"
version = "0.1.0"
description = "AI Governance platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",          # Postgres driver (psycopg 3)
    "pydantic>=2.10",
    "pydantic-settings>=2.7",        # env-driven Settings
    "python-dotenv>=1.0",            # loads .env in dev
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",                     # linter + formatter
    "pytest>=8.3",
    "httpx>=0.28",                   # for testing FastAPI endpoints
    "pyyaml>=6.0.3"                  # for checking yaml files for errors
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # errors, pyflakes, isort, pyupgrade, bugbear

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]