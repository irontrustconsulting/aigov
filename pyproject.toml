[project]
name = "aigov"
version = "0.1.0"
description = "AI Governance platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",          # Postgres driver (psycopg 3)
    "pydantic>=2.10",
    "pydantic-settings>=2.7",        # env-driven Settings
    "python-dotenv>=1.0",            # loads .env in dev
    "pyjwt[crypto]>=2.13",
    "boto3",
    "typer",
    "python-multipart",               # FastAPI File/Form (evidence upload)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",                     # linter + formatter
    "pytest>=8.3",
    "httpx>=0.28",                   # for testing FastAPI endpoints
    "pyyaml>=6.0.3"                  # for checking yaml files for errors
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # errors, pyflakes, isort, pyupgrade, bugbear
ignore = ["B008"]  # FastAPI Depends() in function defaults is the canonical pattern

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures imported by name from a shared helpers module (so two test
# files can share one fixture set without copy-pasting) are then used as
# same-named test-function parameters — the standard pytest pattern, but
# ruff's pyflakes can't see fixture injection and flags it as a redefinition.
"tests/test_aiia.py" = ["F811"]
"tests/test_aiia_feeders.py" = ["F811"]
"tests/test_lifecycle_service.py" = ["F811"]
"tests/test_lifecycle_gates.py" = ["F811"]
"tests/test_lifecycle_advance.py" = ["F811"]
"tests/test_lifecycle_endpoints.py" = ["F811"]
"tests/test_lifecycle_approvals.py" = ["F811"]
"tests/test_lifecycle_rollup.py" = ["F811"]
"tests/test_lifecycle_treatment.py" = ["F811"]
"tests/test_assessment_review.py" = ["F811"]
"tests/test_authorisation.py" = ["F811"]
"tests/test_coverage_service.py" = ["F811"]
"tests/test_coverage_endpoints.py" = ["F811"]
"tests/test_export_service.py" = ["F811"]
"tests/test_export_endpoints.py" = ["F811"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]